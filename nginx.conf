server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/public/screens/ {
    proxy_pass http://orp-backend:8081/api/public/screens/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Serve the standalone screen both at the domain root and under /screen/.
  # The latter is the Pilot default mount point. Strip the prefix internally
  # so /screen/index.html and its /screen/... static assets map to this root.
  location = /screen {
    return 301 /screen/;
  }

  location ^~ /screen/ {
    rewrite ^/screen/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
